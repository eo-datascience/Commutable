<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commutable — where your rent reaches in London</title>
    <meta
      name="description"
      content="Enter where you work and what you can pay. See every London postcode district shaded by how much of its rental market your budget actually reaches, measured in journey time rather than distance."
    />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The whole question lives in the URL, so a link is the unit this
         site is shared in. Without these a shared link arrives in a chat
         as a bare blue string, which reads as broken rather than as a
         map somebody made. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commutable" />
    <meta property="og:title" content="Commutable" />
    <meta
      property="og:description"
      content="Say where you work and what you can pay. See every London postcode district shaded by how much of its rental market your budget actually reaches."
    />
    <meta property="og:image" content="/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A map of London shaded by how much of each district's rental market a budget reaches." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
