<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Commutable share card</title>
    <!--
      The image that goes out with a shared link.

      Deliberately no map and no figures on it. A card showing a shaded
      London would have to be rendered from a build, and would then be
      either out of date or, worse, made from the synthetic numbers; this
      project refuses to publish a screenshot of invented data and the
      same applies to the picture attached to every link. So the card
      carries the mark, the name, the question and the scale, all of which
      are true whatever the data says.

      Render with scripts/make_images.mjs, which writes
      frontend/public/share.png at 1200x630.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #11161d;
        --ink: #f3f5f8;
        --ink-soft: #b3bdca;
        --accent: #eb6834;
        --bin-0: #1c5cab;
        --bin-1: #2a78d6;
        --bin-2: #5598e7;
        --bin-3: #86b6ef;
        --bin-4: #b7d3f6;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: var(--surface);
        color: var(--ink);
        font-family: Archivo, system-ui, sans-serif;
        overflow: hidden;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      h1 {
        font-size: 60px;
        font-stretch: 112%;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .question {
        font-size: 70px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.025em;
        max-width: 20ch;
      }

      .question em {
        font-style: normal;
        color: var(--bin-4);
      }

      .foot p {
        color: var(--ink-soft);
        font-size: 26px;
        max-width: 42ch;
        line-height: 1.45;
      }

      /* The five steps the map is read with, stated without a map. The
         end labels are the whole idea in six words: the colour is a share
         of a market, not a price. */
      .scale {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 30px;
        color: var(--ink-soft);
        font-size: 20px;
        white-space: nowrap;
      }

      .ramp {
        display: flex;
        flex: 0 0 auto;
        gap: 5px;
      }

      .ramp i {
        width: 78px;
        height: 18px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true">
        <path
          d="M 26.65 8.54 A 13 13 0 1 0 26.65 23.46"
          fill="none"
          stroke="#2a78d6"
          stroke-width="3.1"
          stroke-linecap="round"
        />
        <path
          d="M 22.55 11.41 A 8 8 0 1 0 22.55 20.59"
          fill="none"
          stroke="#86b6ef"
          stroke-width="3.1"
          stroke-linecap="round"
        />
        <circle cx="16" cy="16" r="3.4" fill="#eb6834" />
      </svg>
      <h1>Commutable</h1>
    </div>

    <p class="question">Where can you <em>actually</em> afford to live?</p>

    <div class="foot">
      <p>
        Every London postcode district, shaded by how much of its rental market your
        budget reaches. Measured in minutes, not miles.
      </p>
      <div class="scale">
        <span>almost nothing in budget</span>
        <span class="ramp">
          <i style="background: var(--bin-0)"></i>
          <i style="background: var(--bin-1)"></i>
          <i style="background: var(--bin-2)"></i>
          <i style="background: var(--bin-3)"></i>
          <i style="background: var(--bin-4)"></i>
        </span>
        <span>most of the market</span>
      </div>
    </div>
  </body>
</html>
